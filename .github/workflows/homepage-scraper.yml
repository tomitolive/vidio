name: Homepage Scraper

on:
  schedule:
    - cron: '0 */2 * * *'  # Run every 2 hours
  workflow_dispatch:
    inputs:
      pages:
        description: 'Number of homepage pages to check (default 3)'
        required: false
        type: number
        default: 3
      dry_run:
        description: 'Dry run (do not save to DB)'
        required: false
        type: boolean
        default: false

jobs:
  scrape-homepage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium
          sudo apt-get update && sudo apt-get install -y xvfb aria2

      - name: Start FlareSolverr
        run: |
          docker run -d -p 8191:8191 ghcr.io/flaresolverr/flaresolverr:latest
          sleep 10

      - name: Restore homepage state cache
        uses: actions/cache@v4
        with:
          path: homepage_scraper_state.json
          key: homepage-state-${{ github.repository }}
          restore-keys: |
            homepage-state-

      - name: Run Homepage Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          DOODSTREAM_API_KEY: ${{ secrets.DOODSTREAM_API_KEY }}
        run: |
          PAGES="${{ inputs.pages }}"
          if [ -z "$PAGES" ]; then
            PAGES="3"
          fi

          DRY_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi

          echo "Scraping homepage (pages: $PAGES)..."
          xvfb-run --auto-servernum python3 cima4u_crawler.py --homepage --pages "$PAGES" $DRY_FLAG

      - name: Upload state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-state-${{ github.run_number }}
          path: homepage_scraper_state.json
          retention-days: 7

      - name: Display summary
        if: always()
        run: |
          echo "=== Homepage Scraper State ==="
          cat homepage_scraper_state.json 2>/dev/null | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          urls=d.get('seen_urls',{})
          print(f'Total URLs seen: {len(urls)}')
          print(f'Last updated: {d.get(\"last_updated\",\"never\")}')
          " || echo "No state file"
