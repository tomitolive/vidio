name: Video Scraper & Upload

on:
  workflow_dispatch:
    inputs:
      page_url:
        description: 'URL of the page to scrape (e.g., TV10 URL)'
        required: true
        type: string
      server_preference:
        description: 'Preferred server (Streamix, Voe, DoodStream, EarnVids, etc.)'
        required: false
        type: string
        default: 'Streamix'
      api_key:
        description: 'DoodStream API Key'
        required: true
        type: string

jobs:
  scrape-and-upload:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium
      
      - name: Run scraper
        env:
          PAGE_URL: ${{ inputs.page_url }}
          EARNVIDS_API_KEY: ${{ inputs.api_key }}
          SERVER_PREFERENCE: ${{ inputs.server_preference }}
          PROXY_URL: ${{ secrets.PROXY_URL || 'http://ohzgotst:ea339u0rwqy8@p.webshare.io:80' }}
        run: |
          python scrape_upload.py
      
      - name: Upload result as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: upload-result-${{ github.run_number }}
          path: upload_result.json
          retention-days: 30
      
      - name: Display result
        if: success()
        run: |
          echo "=== Upload Result ==="
          cat upload_result.json
