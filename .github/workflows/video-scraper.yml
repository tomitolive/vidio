name: Video Scraper & Upload

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Source type (cimafu, jibi, tmdb, tv10, vidsrc, or topcinemaa)'
        required: false
        type: string
        default: 'cimafu'
      page_url:
        description: 'URL of the page to scrape (for cimafu/jibi/tmdb source)'
        required: false
        type: string
      movie_titles:
        description: 'Movie titles for TMDB search (comma separated, for tmdb source)'
        required: false
        type: string
      tmdb_id:
        description: 'TMDB ID of the movie (for vidsrc source)'
        required: false
        type: string
      server_preference:
        description: 'Preferred server (Streamix, Voe, DoodStream, EarnVids, etc.)'
        required: false
        type: string
        default: 'Streamix'
      api_key:
        description: 'DoodStream API Key (required for both tv10 and vidsrc sources)'
        required: true
        type: string

jobs:
  scrape-and-upload:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium
          sudo apt-get update && sudo apt-get install -y xvfb aria2
      
      - name: Start FlareSolverr
        run: |
          docker run -d -p 8191:8191 ghcr.io/flaresolverr/flaresolverr:latest
          sleep 10
      
      - name: Restore processed movies cache
        uses: actions/cache@v4
        with:
          path: |
            processed_movies.json
            tmdb_movies.json
          key: movies-cache-${{ github.repository }}
          restore-keys: |
            movies-cache-
            processed-movies-

      - name: Run scraper
        env:
          SOURCE: ${{ inputs.source }}
          PAGE_URL: ${{ inputs.page_url }}
          TMDB_ID: ${{ inputs.tmdb_id }}
          MOVIE_TITLES: ${{ inputs.movie_titles }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          DOODSTREAM_API_KEY: ${{ inputs.api_key }}
          EARNVIDS_API_KEY: ${{ inputs.api_key }}
          SERVER_PREFERENCE: ${{ inputs.server_preference }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          HEADLESS: "false"
        run: |
          if [ "${{ inputs.source }}" = "tmdb" ]; then
            echo "Running TMDB Bot..."
            if [ -z "${{ inputs.page_url }}" ] && [ -z "${{ inputs.movie_titles }}" ]; then
              echo "ERROR: page_url or movie_titles required for tmdb source"
              exit 1
            fi
            python tmdb_bot.py
          elif [ "${{ inputs.source }}" = "cimafu" ] || [ "${{ inputs.source }}" = "jibi" ]; then
            if [ -z "${{ inputs.page_url }}" ]; then
              echo "ERROR: page_url is required for cimafu/jibi source"
              exit 1
            fi
            echo "Running Jibi Bot for Cimafu..."
            xvfb-run --auto-servernum python jibi_bot.py "${{ inputs.page_url }}" --api-key "${{ inputs.api_key }}"
          else
            xvfb-run --auto-servernum python scrape_upload.py
          fi

      - name: Upload result as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upload-result-${{ github.run_number }}
          path: |
            upload_result.json
            processed_movies.json
            tmdb_movies.json
            tmdb_search_result.json
          retention-days: 30
      
      - name: Display result
        if: always()
        run: |
          if [ "${{ inputs.source }}" = "tmdb" ]; then
            echo "=== TMDB Catalog (tmdb_movies.json) ==="
            cat tmdb_movies.json 2>/dev/null || echo "No catalog file"
            echo ""
            echo "=== TMDB Search Result (tmdb_search_result.json) ==="
            cat tmdb_search_result.json 2>/dev/null || echo "No search result file"
          else
            echo "=== Upload Result ==="
            cat upload_result.json 2>/dev/null || echo "No upload result file"
          fi
