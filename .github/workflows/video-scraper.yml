name: Video Scraper & Upload

on:
  workflow_dispatch:
    inputs:
      page_url:
        description: 'URL of the page to scrape'
        required: true
        type: string
      tmdb_id:
        description: 'TMDB ID of the movie (optional - bot will try to find it automatically)'
        required: false
        type: string
      api_key:
        description: 'DoodStream API Key'
        required: true
        type: string

jobs:
  scrape-and-upload:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium
          sudo apt-get update && sudo apt-get install -y xvfb aria2
      
      - name: Start FlareSolverr
        run: |
          docker run -d -p 8191:8191 ghcr.io/flaresolverr/flaresolverr:latest
          sleep 10
      
      - name: Restore processed movies cache
        uses: actions/cache@v4
        with:
          path: |
            processed_movies.json
            tmdb_movies.json
          key: movies-cache-${{ github.repository }}
          restore-keys: |
            movies-cache-
            processed-movies-

      - name: Run jibi_bot
        env:
          PAGE_URL: ${{ inputs.page_url }}
          DOODSTREAM_API_KEY: ${{ inputs.api_key }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          echo "Running Jibi Bot..."
          if [ -n "${{ inputs.tmdb_id }}" ] && [[ "${{ inputs.tmdb_id }}" =~ ^[0-9]+$ ]]; then
            echo "Using provided tmdb_id: ${{ inputs.tmdb_id }}"
            xvfb-run --auto-servernum python jibi_bot.py "${{ inputs.page_url }}" --api-key "${{ inputs.api_key }}" --tmdb-id "${{ inputs.tmdb_id }}"
          else
            echo "No valid tmdb_id provided, bot will try to find it automatically..."
            xvfb-run --auto-servernum python jibi_bot.py "${{ inputs.page_url }}" --api-key "${{ inputs.api_key }}"
          fi

      - name: Upload result as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upload-result-${{ github.run_number }}
          path: |
            upload_result.json
            processed_movies.json
            tmdb_movies.json
          retention-days: 30
      
      - name: Display result
        if: always()
        run: |
          echo "=== Upload Result ==="
          cat upload_result.json 2>/dev/null || echo "No upload result file"
          echo ""
          echo "=== Catalog (tmdb_movies.json) ==="
          cat tmdb_movies.json 2>/dev/null || echo "No catalog file"
