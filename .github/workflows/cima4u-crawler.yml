name: Cima4u Category Crawler

on:
  schedule:
    - cron: '0 */2 * * *'  # Run every 2 hours
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scraping mode: movies, tv, or all'
        required: false
        type: choice
        options:
          - all
          - movies
          - tv
        default: all
      max_pages:
        description: 'Maximum pages to process per category (default 20)'
        required: false
        type: number
        default: 20
      max_movies:
        description: 'Maximum movies/episodes to process per category (default 50)'
        required: false
        type: number
        default: 50

jobs:
  crawl-categories:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium
          sudo apt-get update && sudo apt-get install -y xvfb aria2

      - name: Start FlareSolverr
        run: |
          docker run -d -p 8191:8191 ghcr.io/flaresolverr/flaresolverr:latest
          sleep 10

      - name: Restore processed movies cache
        uses: actions/cache@v4
        with:
          path: processed_cima4u_movies.json
          key: processed-movies-${{ github.repository }}
          restore-keys: |
            processed-movies-

      - name: Restore TV series database cache
        uses: actions/cache@v4
        with:
          path: tv_series.db
          key: tv-series-db-${{ github.repository }}
          restore-keys: |
            tv-series-db-

      - name: Run Category Crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          DOODSTREAM_API_KEY: ${{ secrets.DOODSTREAM_API_KEY }}
        run: |
          MODE="${{ inputs.mode }}"
          MAX_PAGES="${{ inputs.max_pages }}"
          MAX_MOVIES="${{ inputs.max_movies }}"

          if [ -z "$MODE" ]; then
            MODE="all"
          fi
          if [ -z "$MAX_PAGES" ]; then
            MAX_PAGES="20"
          fi
          if [ -z "$MAX_MOVIES" ]; then
            MAX_MOVIES="50"
          fi

          echo "Running Cima4u Category Crawler..."
          echo "Mode: $MODE"
          echo "Max pages per category: $MAX_PAGES"
          echo "Max items per category: $MAX_MOVIES"

          xvfb-run --auto-servernum python3 cima4u_crawler.py \
            --mode "$MODE" \
            --api-key "$DOODSTREAM_API_KEY" \
            --max-pages "$MAX_PAGES" \
            --max-movies "$MAX_MOVIES" \
            --all-categories

      - name: Upload processed movies state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: processed-movies-${{ github.run_number }}
          path: processed_cima4u_movies.json
          retention-days: 7

      - name: Upload TV series database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-series-db-${{ github.run_number }}
          path: tv_series.db
          retention-days: 7

      - name: Display summary
        if: always()
        run: |
          echo "=== Cima4u Category Crawler Summary ==="
          if [ -f processed_cima4u_movies.json ]; then
            echo "Processed movies state:"
            cat processed_cima4u_movies.json | python3 -c "
            import json,sys
            d=json.load(sys.stdin)
            urls=d.get('processed_urls',{})
            print(f'Total URLs processed: {len(urls)}')
            print(f'Last updated: {d.get(\"last_updated\",\"never\")}')
            " || echo "No state file"
          fi
          if [ -f tv_series.db ]; then
            echo "TV series database exists"
          fi
