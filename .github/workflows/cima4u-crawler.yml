name: Cima4u Category Crawler

on:
  schedule:
    - cron: '0 * * * *'  # Run every hour
  workflow_dispatch:
    inputs:
      category_url:
        description: 'Category URL to crawl (leave empty for all categories)'
        required: false
        type: string
      api_key:
        description: 'DoodStream API Key (optional for scheduled runs, uses secret if not provided)'
        required: false
        type: string
      max_pages:
        description: 'Maximum pages to process per category'
        required: false
        type: number
        default: 20
      max_movies:
        description: 'Maximum movies to process'
        required: false
        type: number
        default: 50
      all_categories:
        description: 'Process all predefined categories'
        required: false
        type: boolean
        default: true

jobs:
  crawl-category:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium
          sudo apt-get update && sudo apt-get install -y xvfb aria2
      
      - name: Start FlareSolverr
        run: |
          docker run -d -p 8191:8191 ghcr.io/flaresolverr/flaresolverr:latest
          sleep 10
      
      - name: Restore processed movies cache
        uses: actions/cache@v4
        with:
          path: |
            processed_cima4u_movies.json
            processed_movies.json
            tmdb_movies.json
          key: crawler-cache-${{ github.repository }}
          restore-keys: |
            crawler-cache-
            processed-movies-

      - name: Run Cima4u Crawler
        env:
          DOODSTREAM_API_KEY: ${{ inputs.api_key || secrets.DOODSTREAM_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          echo "Running Cima4u Crawler..."
          
          API_KEY="${{ inputs.api_key }}"
          if [ -z "$API_KEY" ]; then
            API_KEY="${{ secrets.DOODSTREAM_API_KEY }}"
          fi
          
          if [ -z "$API_KEY" ]; then
            echo "Error: No API key provided"
            exit 1
          fi
          
          # Set defaults for scheduled runs (no inputs)
          ALL_CATEGORIES="${{ inputs.all_categories }}"
          if [ -z "$ALL_CATEGORIES" ]; then
            ALL_CATEGORIES="true"
          fi
          
          MAX_PAGES="${{ inputs.max_pages }}"
          if [ -z "$MAX_PAGES" ]; then
            MAX_PAGES="20"
          fi
          
          MAX_MOVIES="${{ inputs.max_movies }}"
          if [ -z "$MAX_MOVIES" ]; then
            MAX_MOVIES="50"
          fi
          
          CATEGORY_URL="${{ inputs.category_url }}"
          
          if [ "$ALL_CATEGORIES" = "true" ] || [ -z "$CATEGORY_URL" ]; then
            echo "Processing all predefined categories"
            xvfb-run --auto-servernum python cima4u_crawler.py \
              --all-categories \
              --api-key "$API_KEY" \
              --max-pages "$MAX_PAGES" \
              --max-movies "$MAX_MOVIES"
          elif [ -n "$CATEGORY_URL" ]; then
            echo "Processing category: $CATEGORY_URL"
            xvfb-run --auto-servernum python cima4u_crawler.py \
              --category "$CATEGORY_URL" \
              --api-key "$API_KEY" \
              --max-pages "$MAX_PAGES" \
              --max-movies "$MAX_MOVIES"
          else
            echo "No category specified, processing all predefined categories"
            xvfb-run --auto-servernum python cima4u_crawler.py \
              --all-categories \
              --api-key "$API_KEY" \
              --max-pages "$MAX_PAGES" \
              --max-movies "$MAX_MOVIES"
          fi

      - name: Upload crawler results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawler-results-${{ github.run_number }}
          path: |
            processed_cima4u_movies.json
            upload_result.json
            tmdb_movies.json
          retention-days: 30
      
      - name: Display results
        if: always()
        run: |
          echo "=== Crawler Results ==="
          cat processed_cima4u_movies.json 2>/dev/null || echo "No crawler results file"

