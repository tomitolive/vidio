name: FileMoon Mirror (DoodStream -> FileMoon)

on:
  workflow_dispatch:
    inputs:
      filecode:
        description: 'DoodStream file code to mirror (get it from --list-account run)'
        required: true
        type: string
      source_url:
        description: 'Optional direct video URL to upload (skips DoodStream extraction)'
        required: false
        type: string

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium
          sudo apt-get update && sudo apt-get install -y xvfb aria2

      - name: Start FlareSolverr
        run: |
          docker run -d -p 8191:8191 ghcr.io/flaresolverr/flaresolverr:latest
          sleep 12

      - name: Run FileMoon mirror
        env:
          DOODSTREAM_API_KEY: ${{ secrets.DOODSTREAM_API_KEY }}
          FILEMOON_API_KEY: ${{ secrets.FILEMOON_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          FLARESOLVERR_URL="http://localhost:8191/v1" python3 mirror_doodstream_to_filemoon.py \
            --filecode "${{ inputs.filecode }}" \
            --source-url "${{ inputs.source_url }}" \
            || echo "Exit code $? — check artifact mapping for details"

      - name: Upload mirror mapping artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filemoon-mirror-${{ github.run_number }}
          path: |
            filemoon_mirror.json
            filemoon_mirror_results.json
          retention-days: 7

      - name: Print result
        if: always()
        run: |
          echo "=== FileMoon Mirror Summary ==="
          if [ -f filemoon_mirror.json ]; then
            cat filemoon_mirror.json
          else
            echo "No filemoon_mirror.json produced"
          fi